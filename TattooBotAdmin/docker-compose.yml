services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-tattooadmin}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-tattooadmin}"]
      interval: 3s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  app:
    container_name: tattoobotadmin-app-1   # твой контейнер с админкой
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tattooadmin
      HOST: 0.0.0.0
      PORT: "6050"
      UPLOAD_DIR: /app/uploads
      BOT_RESTART_SCRIPT: /scripts/restart-bot.sh
      BOT_ENV_FILE: /project/bot-config/bot.env
      PROJ_DIR: /project

      # ---> ВАЖНО: эти 3 переменные нужны nginx
      VIRTUAL_HOST: tatto.shadownet.live
      VIRTUAL_PORT: 6050
      LETSENCRYPT_HOST: tatto.shadownet.live
      LETSENCRYPT_EMAIL: shadownetvpn@outlook.com

    user: "0:0"   # доступ к /var/run/docker.sock
    volumes:
      - ./:/project
      - ./scripts:/scripts:ro
      - ./uploads:/app/uploads       # том для медиа
      - ./data:/app/data             # том для расписания/акций и прочих json-данных
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "6050"                       # порт доступен внутри сети докера, наружу не торчим
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6050/api/health || exit 1"]
      timeout: 2s
      interval: 5s
      retries: 20
    restart: unless-stopped

  bot:
    build:
      context: ./bot
    image: tattoobotadmin-bot:latest
    container_name: tatto_bot_host
    restart: unless-stopped
    env_file:
      - ./bot-config/bot.env         # сюда скрипт пишет TELEGRAM_BOT_TOKEN
    environment:
      # бот стучится в админку по внутреннему сервису, чтобы не зависеть от внешнего https
      API_BASE: http://app:6050
    command: ["python", "/app/bot.py"]
    tmpfs:
      - /app/.env
    depends_on:
      app:
        condition: service_started

  # ---------- NGINX статический, без доступа к другим проектам ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: tatto-nginx
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/dhparam:/etc/nginx/dhparam:ro
    restart: unless-stopped

volumes:
  postgres_data:
