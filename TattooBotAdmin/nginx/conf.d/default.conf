server {
    listen 80;
    server_name tatto.shadownet.live;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tatto.shadownet.live;

    ssl_certificate     /etc/nginx/certs/tatto.shadownet.live/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/tatto.shadownet.live/key.pem;
    ssl_dhparam         /etc/nginx/dhparam/dhparam.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305';

    client_max_body_size 50m;
    keepalive_timeout 65;

    # чтобы не трогать другие проекты — только этот домен обрабатываем
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        proxy_pass http://app:6050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /uploads/ {
        proxy_pass http://app:6050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# fallback: никакие другие домены не обслуживаем
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/certs/tatto.shadownet.live/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/tatto.shadownet.live/key.pem;
    ssl_dhparam         /etc/nginx/dhparam/dhparam.pem;
    return 444;
}
